<!doctype html>
<meta charset=utf-8>
<style>
html,body{margin:0;height:440px;overflow:hidden;background:#fff;user-select:none}
canvas{display:block;width:100%;height:440px}
</style>
<canvas id=c></canvas>
<script>
// Gin's bankai, Kamishini no Yari: ink-style cut, ~3s, loops; tap replays.
// One path per layer keeps a frame at a few hundred canvas commands.
const TW=window.TelegramWidget,cv=document.getElementById('c'),g=cv.getContext('2d');
const T=3.6,F='"Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP",serif',A0=-2.35,A1=-3.3,HX=-74,HY=-130;
let W,H,D,u,t0=0,fg,bg,sl=[],st=-1,hp=0;
const cl=(v,a=0,b=1)=>v<a?a:v>b?b:v,eo=x=>1-Math.pow(1-cl(x),3),ph=(t,a,b)=>cl((t-a)/(b-a)),R=Math.random;
// hand-drawn-looking hatching on the coat, generated once
const HT=[];for(let i=0;i<34;i++){const y=-20+R()*240,x=-110+R()*60;HT.push(x,y,x+60+R()*130,y-20-R()*40)}
function fit(){W=cv.clientWidth;H=cv.clientHeight;D=Math.min(devicePixelRatio||1,2,Math.sqrt(3.5e6/(W*H)));
  cv.width=W*D|0;cv.height=H*D|0;u=Math.min(W,H)/400}
const K=()=>.95*u,SX=()=>W*.66,SY=()=>H*.36;
function hand(A){const r=(A-A0)*.55,c=Math.cos(r),s=Math.sin(r);return[SX()+K()*(HX*c-HY*s),SY()+K()*(HX*s+HY*c)]}
const P=a=>{g.beginPath();g.moveTo(a[0],a[1]);for(let i=2;i<a.length;i+=2)g.lineTo(a[i],a[i+1]);g.closePath()};
const ink=(a,f,w)=>{P(a);g.fillStyle=f;g.fill();if(w){g.lineWidth=w;g.strokeStyle=fg;g.stroke()}};
function lines(fx,fy,k){
  // regenerate every ~70ms so the focus lines boil like hand-drawn frames
  const s=Math.floor(performance.now()/70);if(s!=st){st=s;sl=[];for(let i=0;i<150;i++)sl.push(R()*6.283,.12+R()*.4,.4+R()*2.2)}
  const L=Math.hypot(W,H);g.beginPath();
  for(let i=0;i<sl.length;i+=3){const a=sl[i],r=L*(sl[i+1]+(1-k)*.6),w=sl[i+2]*u*(.6+k*1.6),c=Math.cos(a),s=Math.sin(a);
    g.moveTo(fx+c*r,fy+s*r);g.lineTo(fx+c*L*1.5-s*w*6,fy+s*L*1.5+c*w*6);g.lineTo(fx+c*L*1.5+s*w*6,fy+s*L*1.5-c*w*6)}
  g.fillStyle=fg;g.fill()}
function txt(s,x,y,z,r,a){if(a<=0)return;g.save();g.globalAlpha=a;g.translate(x,y);g.rotate(r||0);g.font='900 '+z+'px '+F;
  g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';g.lineWidth=z/7;g.strokeStyle=bg;g.strokeText(s,0,0);g.fillStyle=fg;g.fillText(s,0,0);g.restore()}
function gin(t,A,L){
  const k=K();g.save();g.translate(SX(),SY()+(1-eo(ph(t,0,.5)))*30*u);g.scale(k,k);
  g.lineJoin='round';g.lineCap='round';
  // torn black hakama with white speed hatching
  ink([-22,-8,32,-4,62,40,58,110,80,205,52,178,40,214,14,186,-8,226,-28,182,-58,212,-66,170,-104,196,-92,120,-56,40],fg);
  g.save();g.clip();g.beginPath();for(let i=0;i<HT.length;i+=4){g.moveTo(HT[i],HT[i+1]);g.lineTo(HT[i+2],HT[i+3])}
  g.lineWidth=1;g.strokeStyle=bg;g.stroke();g.restore();
  ink([18,-6,56,36,40,64,12,22],bg,2.2);ink([8,64,30,70,36,96,22,90,10,104,2,84],bg,2);
  // raised arm: bare forearm out of a wide hanging sleeve with a dark opening
  g.save();g.rotate((A-A0)*.55);
  ink([-50,-70,-58,-74,-80,-128,-68,-134],bg,2.4);
  ink([-6,-30,-30,-62,-58,-84,-78,-70,-92,-34,-84,4,-60,28,-30,30,-14,10],bg,2.6);
  g.save();g.translate(-66,-58);g.rotate(.5);g.beginPath();g.ellipse(0,0,13,27,0,0,7);g.fillStyle=fg;g.fill();g.restore();
  g.beginPath();g.moveTo(-26,-24);g.quadraticCurveTo(-50,-10,-48,22);g.moveTo(-18,-6);g.quadraticCurveTo(-30,8,-28,26);g.lineWidth=1.4;g.strokeStyle=fg;g.stroke();
  g.translate(HX,HY);g.beginPath();g.arc(0,0,7,0,7);g.fillStyle=bg;g.fill();g.stroke();
  g.rotate(A-(A-A0)*.55);
  ink([-30,-4.5,0,-4.5,0,4.5,-30,4.5],fg);ink([3,-10,9,-10,9,10,3,10],fg);
  // white halo keeps the blade readable over the focus lines
  if(L>0){const b=[10,-6,10+L*.99,-3,10+L,0,10+L*.99,3,10,6];P(b);g.lineWidth=10;g.strokeStyle=bg;g.stroke();ink(b,bg,2.2);g.beginPath();g.moveTo(14,1.5);g.lineTo(10+L*.95,1);g.lineWidth=1;g.stroke()}
  g.restore();
  // head bowed, silver fringe over the eyes, fox grin
  g.translate(44,6);g.rotate(.35);g.beginPath();g.ellipse(0,0,24,28,0,0,7);g.fillStyle=bg;g.fill();g.lineWidth=2.4;g.stroke();
  g.beginPath();for(let i=0;i<10;i++){const x=-22+i*5;g.moveTo(x,-27);g.quadraticCurveTo(x+2,-8,x-4+i%2*5,4+(i%3)*5)}g.lineWidth=1.2;g.stroke();
  ink([-6,10,18,8,16,22,-2,24],fg);g.beginPath();g.moveTo(-4,16);g.quadraticCurveTo(6,22,16,13);g.strokeStyle=bg;g.lineWidth=1.6;g.stroke();
  g.restore()}
function draw(t){
  const inv=(t>1.02&&t<1.07)||(t>1.12&&t<1.16),sh=t>1.02?16*u*Math.exp(-(t-1.02)*7):0;
  fg=inv?'#fff':'#000';bg=inv?'#000':'#fff';
  g.setTransform(D,0,0,D,0,0);g.fillStyle=bg;g.fillRect(0,0,W,H);
  g.translate((R()-.5)*sh,(R()-.5)*sh);
  lines(W*.86,H*.16,eo(ph(t,.1,.6))*.7+(t>1.02?.3*Math.exp(-(t-1.02)*3):0));
  // ruined pillars in the foreground, bottom right
  g.lineWidth=3*u;g.strokeStyle=bg;
  for(const[x,w,h]of[[.70,.06,.42],[.80,.05,.55],[.90,.07,.36]])ink([W*x,H,W*x,H*(1-h),W*(x+w*.4),H*(1-h-.04),W*(x+w),H*(1-h+.02),W*(x+w),H],fg),g.stroke();
  const A=A0+(A1-A0)*eo(ph(t,1.05,1.45)),L=eo(ph(t,.9,1.03))*Math.hypot(W,H)*1.6/u;
  // sweep trail: arcs around the hand while the blade swings down
  if(t>1.05&&t<2){const a=1-ph(t,1.45,2),[hx,hy]=hand(A);
    g.globalAlpha=a;g.beginPath();for(let i=0;i<14;i++){const r=(90+i*i*10)*u;g.moveTo(hx+r*Math.cos(A0),hy+r*Math.sin(A0));g.arc(hx,hy,r,A0,A,1)}
    g.lineWidth=(1+a)*u;g.strokeStyle=fg;g.stroke();g.globalAlpha=1}
  gin(t,A,L);
  const z=1+.8*(1-eo(ph(t,.3,.45)));
  txt('卍解',W*.3,H*.2,64*u*z,-.08,ph(t,.3,.34)*(1-ph(t,.9,1)));
  txt('ザァ',W*.2,H*.86,54*u,-.25,ph(t,1.04,1.1)*(1-ph(t,2.6,3)));
  for(let i=0;i<3;i++)txt('神殺鎗'[i],W*.1,H*.4+i*40*u,36*u,0,ph(t,1.5+i*.12,1.8+i*.12)*(1-ph(t,3,3.3)));
  g.setTransform(D,0,0,D,0,0);g.globalAlpha=ph(t,3.25,T);g.fillStyle='#fff';g.fillRect(0,0,W,H);g.globalAlpha=1}
function loop(now){let t=(now-t0)/1000;if(t>T){t0=now;t=0;hp=0}
  if(t>1.02&&!hp){hp=1;TW&&TW.HapticFeedback&&TW.HapticFeedback.impactOccurred('heavy')}
  draw(t);requestAnimationFrame(loop)}
cv.addEventListener('pointerdown',()=>{t0=performance.now();hp=0});
if(window.ResizeObserver)new ResizeObserver(fit).observe(cv);
document.addEventListener('visibilitychange',()=>{t0=performance.now()});
fit();draw(1.8);requestAnimationFrame(n=>{t0=n;loop(n)});
TW&&TW.ready&&TW.ready();
</script>
